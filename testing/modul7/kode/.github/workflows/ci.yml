# =============================================================================
#  .github/workflows/ci.yml  –  ENDRET i Oppgave 7
# -----------------------------------------------------------------------------
#  CI = kontroll av KODEN, før den slås sammen med main.
#
#  Kjører på hver pull request. To jobber, i denne rekkefølgen:
#
#    1. kontroll   kodekontroll: scripts/valider.sh – fmt, validate, TFLint
#                  og Checkov, uten tilgang til Azure          (Oppgave 7)
#    2. plan-dev   plan mot dev, lagt som kommentar på PR-en  (uendret)
#
#  Det finnes bare ÉN CI-fil, ikke én per miljø. fmt og validate gir samme svar
#  uansett hvilket miljø koden skal til – de sjekker koden, ikke miljøet.
# =============================================================================

name: CI

on:
  pull_request:
    branches: [main]
    # Med vilje INGEN paths-filter. Begge jobbene er required status checks på
    # main. Starter ikke workflowen, rapporterer ikke kontrollene inn, og PR-en
    # venter for alltid på en hake som aldri kommer – for eksempel når PR-en
    # bare legger til en ny workflow-fil.

# Standard for alle jobbene i fila: bare lese koden. plan-dev gir seg selv mer
# under – kontroll gjør det ikke.
permissions:
  contents: read

# Pusher du tre commits til grenen, er bare den siste kjøringen interessant.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------- Oppgave 7 -----
  kontroll:
    # Nytt navn: jobben gjør mer enn fmt og validate nå. Dette er navnet du
    # velger som required status check i branch protection.
    #
    # Jobb-ID-en er fortsatt `kontroll`, så `needs: kontroll` i plan-dev under
    # virker som før. Bare name: er endret.
    name: kodekontroll
    runs-on: ubuntu-latest

    # Fortsatt ingen environment, ingen Azure/login, ingen secrets.
    # Alle fire kontrollene er offline.
    steps:
      - name: Hent koden
        uses: actions/checkout@v5

      # --- Installer verktøyene, med låste versjoner ---------------------
      # Samme versjoner som du installerte lokalt (modul 7 side 3). Er de
      # ulike, kan du få grønt lokalt og rødt her.
      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0

      - name: Installer TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer Checkov
        run: pip install checkov==3.3.21

      # --- Kjør kontrollene: det samme skriptet som du kjører lokalt ------
      # Ingen continue-on-error. Funn som skal godtas, godtas med et begrunnet
      # unntak i koden – ikke ved å la porten se bort fra dem.
      - name: Kjør valider.sh
        run: bash scripts/valider.sh
        env:
          # tflint --init laster ned Azure-pluginen fra GitHub. Med token
          # slipper du «rate limit» når mange kjører samtidig.
          GITHUB_TOKEN: ${{ github.token }}

  # ------------------------------------------------------------- steg 3 -----
  plan-dev:
    name: plan mot dev
    # Mennesket skal ikke lese en plan for kode som ikke engang er formatert.
    needs: kontroll
    runs-on: ubuntu-latest

    # Planen går alltid mot dev. test og prod nevnes ikke i denne fila.
    environment: dev

    # Denne jobben trenger mer enn standarden øverst:
    permissions:
      contents: read
      id-token: write        # logge inn i Azure med OIDC
      pull-requests: write   # skrive kommentaren på PR-en

    defaults:
      run:
        working-directory: stacks/nettverk

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_INPUT: false
      TF_IN_AUTOMATION: true

    steps:
      - name: Hent koden
        uses: actions/checkout@v5

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false   # ellers blir kommentaren full av støy

      - name: Logg inn i Azure
        uses: Azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Hent parameterfila for dev
        run: |
          az keyvault secret show \
            --vault-name "${{ secrets.KEYVAULT_NAME }}" \
            --name "tfvars-dev" \
            --query value -o tsv > params.auto.tfvars

      - name: Init
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/shared/backend.hcl" \
            -backend-config="key=env/dev/nettverk.tfstate"

      # -lock=false: planen skriver ingenting, så den skal ikke blokkere en
      # utrulling som går samtidig. -no-color: ellers [0m[1m i kommentaren.
      - name: Plan
        run: terraform plan -lock=false -no-color -out=tfplan

      - name: Legg planen som kommentar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Terraform plan mot dev"
            echo
            terraform show -no-color tfplan | grep -E '^(Plan:|No changes)' || true
            echo
            echo "<details><summary>Vis hele planen</summary>"
            echo
            echo '```terraform'
            terraform show -no-color tfplan
            echo '```'
            echo
            echo "</details>"
          } > "${{ github.workspace }}/kommentar.md"

          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file "${{ github.workspace }}/kommentar.md"

      - name: Slett parameterfila
        if: always()
        run: rm -f params.auto.tfvars
