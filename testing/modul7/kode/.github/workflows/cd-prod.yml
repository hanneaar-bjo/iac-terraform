# =============================================================================
#  .github/workflows/cd-prod.yml  –  STEG 6
# -----------------------------------------------------------------------------
#  Utrulling til prod. Kopi av cd-test.yml der «test» er byttet med «prod».
#  Det er hele forskjellen i KODEN.
#
#  Forskjellen i OPPFØRSEL ligger ikke i denne fila, men i GitHub:
#  prod-environmentet har to protection rules (steg 6):
#
#    * Required reviewers – jobben venter på at et menneske godkjenner
#    * Deployment branches: main – kan bare startes fra main
#
#  Hva godkjenner du? At SHA-en som besto test, skal ut i prod. Planen for prod
#  lages først ETTER godkjenningen, så du godkjenner commiten, ikke planen.
#  Refleksjonen i steg 9 spør hva det betyr, og utvidelse A viser hvordan du
#  kan godkjenne selve planen.
# =============================================================================

name: CD prod

run-name: prod ← ${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Hele commit-SHA-en som allerede er rullet ut i test
        type: string
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: nettverk-prod
  cancel-in-progress: false

jobs:
  rull-ut:
    runs-on: ubuntu-latest

    # Denne linja gjør to ting: den gir jobben prod sin identitet i Azure,
    # OG den utløser porten. Jobben starter ikke før noen har godkjent.
    environment: prod

    defaults:
      run:
        working-directory: stacks/nettverk

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_INPUT: false
      TF_IN_AUTOMATION: true

    steps:
      - name: Hent commiten som skal promoteres
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Sjekk at commiten ligger på main
        env:
          SHA: ${{ inputs.sha }}
        run: |
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA ligger ikke på main. Bare commits som er merget, kan promoteres."
            exit 1
          fi
          echo "OK: $SHA ligger på main."

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Logg inn i Azure
        uses: Azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Hent parameterfila for prod
        run: |
          az keyvault secret show \
            --vault-name "${{ secrets.KEYVAULT_NAME }}" \
            --name "tfvars-prod" \
            --query value -o tsv > params.auto.tfvars

      - name: Init
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/shared/backend.hcl" \
            -backend-config="key=env/prod/nettverk.tfstate"

      - name: Plan
        run: terraform plan -out=tfplan

      - name: Apply
        run: terraform apply tfplan

      - name: Slett parameterfila
        if: always()
        run: rm -f params.auto.tfvars

      - name: Skriv oppsummering
        env:
          SHA: ${{ inputs.sha }}
        run: |
          {
            echo "## ✅ Prod er oppdatert"
            echo
            echo "Promotert commit:"
            echo
            echo '```'
            echo "$SHA"
            echo '```'
            echo
            echo "Sjekk at det er den samme SHA-en som i kjøringene *dev ←* og *test ←* i Actions-lista."
          } >> "$GITHUB_STEP_SUMMARY"
